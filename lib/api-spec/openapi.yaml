openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PDF Tools API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: PDF tool catalog
  - name: jobs
    description: Processing job history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List all available PDF tools
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"

  /stats:
    get:
      operationId: getStats
      tags: [jobs]
      summary: Get overall processing statistics
      responses:
        "200":
          description: Processing stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List recent processing jobs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Record a completed processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Tool:
      type: object
      required: [id, name, description, category, icon, inputLabel, outputLabel]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        icon:
          type: string
        inputLabel:
          type: string
        outputLabel:
          type: string
        acceptMultiple:
          type: boolean
        color:
          type: string

    Stats:
      type: object
      required: [totalJobs, jobsToday, filesProcessed, totalInputSizeMb, totalOutputSizeMb]
      properties:
        totalJobs:
          type: number
        jobsToday:
          type: number
        filesProcessed:
          type: number
        totalInputSizeMb:
          type: number
        totalOutputSizeMb:
          type: number
        popularTool:
          type: ["string", "null"]

    Job:
      type: object
      required: [id, tool, originalFilename, inputSizeBytes, status, createdAt]
      properties:
        id:
          type: number
        tool:
          type: string
        originalFilename:
          type: string
        inputSizeBytes:
          type: number
        outputSizeBytes:
          type: ["number", "null"]
        status:
          type: string
        createdAt:
          type: string

    JobInput:
      type: object
      required: [tool, originalFilename, inputSizeBytes, status]
      properties:
        tool:
          type: string
        originalFilename:
          type: string
        inputSizeBytes:
          type: number
        outputSizeBytes:
          type: ["number", "null"]
        status:
          type: string
