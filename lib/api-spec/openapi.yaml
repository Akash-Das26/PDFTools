openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PDF Tools API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: PDF tool catalog
  - name: jobs
    description: Processing job history
  - name: pdf
    description: PDF processing tools
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List all available PDF tools
      responses:
        "200":
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"

  /stats:
    get:
      operationId: getStats
      tags: [jobs]
      summary: Get overall processing statistics
      responses:
        "200":
          description: Processing stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List recent processing jobs
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Record a completed processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  # ── PDF tools ───────────────────────────────────────────────────────────────
  # Every tool accepts `multipart/form-data` and models its upload parts
  # explicitly, because they are not interchangeable — the field name selects a
  # different multer handler on the server:
  #   file    one document   (`upload.single`)
  #   files   several, appended in upload order   (`upload.array`)
  #   image   the watermark image on /pdf/watermark   (`upload.fields`)
  # Limits come from the shared multer instance: 50 MB per file, 20 files.
  # The remaining form fields are the tool options.
  /pdf/merge:
    post:
      operationId: mergePdfs
      tags: [pdf]
      summary: Combine two or more PDFs into one
      description: Send two or more documents as repeated `files` parts, in the
        order they should be appended. Files that cannot be parsed are skipped
        with a server-side warning rather than failing the whole request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  minItems: 2
                  description: Two or more documents, sent as repeated `files` parts.
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Merged PDF
        "400":
          description: Fewer than two files were sent

  /pdf/split:
    post:
      operationId: splitPdf
      tags: [pdf]
      summary: Cut a PDF into single-page documents
      description: Send the document as `file`. A single target page comes back
        as a PDF; anything longer comes back as a ZIP of one-page PDFs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to split.
                splitType:
                  type: string
                  enum: [all, pages]
                  default: all
                  description: '`all` splits every page; `pages` splits only `pages`.'
                pages:
                  type: string
                  description: 'Only read when `splitType` is `pages`. Empty means every page.'
      responses:
        "200":
          description: One-page PDF, or a ZIP of one-page PDFs

  /pdf/rotate:
    post:
      operationId: rotatePdf
      tags: [pdf]
      summary: Rotate all or selected pages
      description: Send the document as `file`, or several documents as repeated `files` parts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [rotation]
              properties:
                files:
                  type: array
                  description: One or more documents, sent as repeated `files` parts.
                  items:
                    type: string
                    format: binary
                rotation:
                  type: integer
                  description: Clockwise rotation in degrees
                  enum: [90, 180, 270]
                pages:
                  type: string
                  description: 'Page selection such as "1,3,5-8". Empty means every page.'
      responses:
        "200":
          description: Rotated PDF (ZIP when several documents were uploaded)

  /pdf/remove-pages:
    post:
      operationId: removePdfPages
      tags: [pdf]
      summary: Delete selected pages
      description: Send the document as `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pages]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to delete pages from.
                pages:
                  type: string
                  description: 'Pages to delete, e.g. "2,4,7-9"'
      responses:
        "200":
          description: PDF without the removed pages

  /pdf/reorder-pages:
    post:
      operationId: reorderPdfPages
      tags: [pdf]
      summary: Rebuild a PDF in a new page order
      description: Send the document as `file`. Pages missing from `order` are dropped.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [order]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to reorder.
                order:
                  type: string
                  description: 'Page numbers in their new order, e.g. "3,1,2,4"'
      responses:
        "200":
          description: Reordered PDF

  /pdf/compare:
    post:
      operationId: comparePdfs
      tags: [pdf]
      summary: Compare the text of two PDFs
      description: Send exactly two documents as repeated `files` parts. Returns counts, the ordered diff, and a Markdown rendering of the report.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: One or more documents, sent as repeated `files` parts.
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: JSON comparison report with a downloadable Markdown rendering

  /pdf/page-info:
    post:
      operationId: getPdfPageInfo
      tags: [pdf]
      summary: Read page count, geometry and previews
      description: Send the document as `file`. The only PDF tool endpoint returning JSON. Thumbnails are omitted for documents above the preview page limit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to inspect.
                thumbnails:
                  type: boolean
                  default: true
                thumbnailWidth:
                  type: integer
                  description: Preview width in pixels
                  default: 140
      responses:
        "200":
          description: Page information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfPageInfo"

  /pdf/watermark:
    post:
      operationId: watermarkPdf
      tags: [pdf]
      summary: Stamp text or an image watermark
      description: Send the document as `file` and, for image watermarks, the image as the `image` part.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to stamp.
                image:
                  type: string
                  format: binary
                  description: The watermark image. Required when `type` is `image`.
                type:
                  type: string
                  enum: [text, image]
                  default: text
                text:
                  type: string
                opacity:
                  type: number
                  default: 0.3
                position:
                  type: string
                  enum:
                    - top-left
                    - top-center
                    - top-right
                    - middle-left
                    - center
                    - middle-right
                    - bottom-left
                    - bottom-center
                    - bottom-right
                    - diagonal
                  default: diagonal
                color:
                  type: string
                  description: Hex colour used for text watermarks
                fontSize:
                  type: number
                rotation:
                  type: number
                scale:
                  type: number
                  description: Image watermark width as a fraction of the page width
                  default: 0.35
                pages:
                  type: string
      responses:
        "200":
          description: Watermarked PDF

  /pdf/protect:
    post:
      operationId: protectPdf
      tags: [pdf]
      summary: Encrypt a PDF with a password
      description: Send the document as `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [password]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to encrypt.
                password:
                  type: string
                ownerPassword:
                  type: string
                algorithm:
                  type: string
                  enum: [AES-256, AES-128, RC4-128, RC4-40]
                  default: AES-256
                allowPrinting:
                  type: boolean
                  default: true
                allowCopying:
                  type: boolean
                  default: true
                allowModifying:
                  type: boolean
                  default: true
                allowAnnotating:
                  type: boolean
                  default: true
                allowFillingForms:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Encrypted PDF

  /pdf/unlock:
    post:
      operationId: unlockPdf
      tags: [pdf]
      summary: Remove password protection when the password is known
      description: Send the document as `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The encrypted PDF.
                password:
                  type: string
      responses:
        "200":
          description: Unencrypted PDF

  /pdf/crop:
    post:
      operationId: cropPdf
      tags: [pdf]
      summary: Crop pages by adjusting their page boxes
      description: Send the document as `file`. Margins are in points or percent of the page.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to crop.
                unit:
                  type: string
                  enum: [pt, percent]
                  default: percent
                top:
                  type: number
                  default: 0
                right:
                  type: number
                  default: 0
                bottom:
                  type: number
                  default: 0
                left:
                  type: number
                  default: 0
                pages:
                  type: string
      responses:
        "200":
          description: Cropped PDF

  /pdf/pdf-to-images:
    post:
      operationId: pdfToImages
      tags: [pdf]
      summary: Render pages as JPG or PNG
      description: Send the document as `file`. Several pages come back as a ZIP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to render.
                format:
                  type: string
                  enum: [jpg, png]
                  default: jpg
                quality:
                  type: integer
                  default: 85
                width:
                  type: integer
                  description: Rendered width in pixels
                  default: 1200
                pages:
                  type: string
      responses:
        "200":
          description: Page image, or a ZIP of images for multi-page selections

  /pdf/images-to-pdf:
    post:
      operationId: imagesToPdf
      tags: [pdf]
      summary: Compose JPG/PNG uploads into one PDF
      description: Send one or more images as repeated `files` parts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: One or more documents, sent as repeated `files` parts.
                  items:
                    type: string
                    format: binary
                pageSize:
                  type: string
                  enum: [fit, a4, letter]
                  default: fit
                orientation:
                  type: string
                  enum: [auto, portrait, landscape]
                  default: auto
                margin:
                  type: number
                  default: 24
      responses:
        "200":
          description: PDF containing one page per image

  /pdf/word-to-pdf:
    post:
      operationId: wordToPdf
      tags: [pdf]
      summary: Convert a Word document to PDF
      description: Send a .doc or .docx as `file`. Conversion runs through a
        headless LibreOffice, so the server answers 503 when the host has no
        `soffice` binary. The document package must be intact - a mislabelled or
        damaged file is rejected instead of being silently converted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The .doc or .docx to convert.
                pdfa:
                  type: string
                  enum: [off, 1b, 2b, 3b]
                  default: "off"
                  description: Plain PDF, or PDF/A-1b / -2b / -3b export.
      responses:
        "200":
          description: Converted PDF

  /pdf/ppt-to-pdf:
    post:
      operationId: pptToPdf
      tags: [pdf]
      summary: Convert a PowerPoint deck to PDF
      description: Send a .ppt or .pptx as `file`. Uses the same headless
        LibreOffice pipeline as the Word tool, including the 503 when `soffice`
        is unavailable.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The .ppt or .pptx to convert.
                pdfa:
                  type: string
                  enum: [off, 1b, 2b, 3b]
                  default: "off"
                  description: Plain PDF, or PDF/A-1b / -2b / -3b export.
      responses:
        "200":
          description: Converted PDF

  /pdf/excel-to-pdf:
    post:
      operationId: excelToPdf
      tags: [pdf]
      summary: Convert a spreadsheet to PDF
      description: Send a .xls or .xlsx as `file`. Uses the same headless
        LibreOffice pipeline as the Word tool, including the 503 when `soffice`
        is unavailable.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The .xls or .xlsx to convert.
                pdfa:
                  type: string
                  enum: [off, 1b, 2b, 3b]
                  default: "off"
                  description: Plain PDF, or PDF/A-1b / -2b / -3b export.
                fitToPage:
                  type: boolean
                  default: false
                  description: Scale each sheet so its used range fits one page.
      responses:
        "200":
          description: Converted PDF

  /pdf/scan-to-pdf:
    post:
      operationId: scanToPdf
      tags: [pdf]
      summary: Compose captured pages into one PDF
      description: Send one or more JPG/PNG captures as repeated `files` parts,
        in page order. The pages are composed exactly as JPG/PNG to PDF composes
        them; with `searchable=true` the result goes through the OCR pass that
        backs `POST /pdf/ocr`, adding an invisible text layer (so it costs a real
        recognition run per page and can fail the way OCR fails).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: Captured pages, sent as repeated `files` parts in page order.
                  items:
                    type: string
                    format: binary
                pageSize:
                  type: string
                  enum: [fit, a4, letter]
                  default: fit
                orientation:
                  type: string
                  enum: [auto, portrait, landscape]
                  default: auto
                margin:
                  type: number
                  default: 24
                searchable:
                  type: boolean
                  default: false
                  description: Run OCR over the composed pages and add a text layer.
                language:
                  type: string
                  default: eng
                  description: OCR language pack, one of the codes `POST /pdf/ocr` accepts.
      responses:
        "200":
          description: Scanned PDF, searchable when requested

  /pdf/html-to-pdf:
    post:
      operationId: htmlToPdf
      tags: [pdf]
      summary: Convert an HTML file to PDF
      description: Send a .html or .htm file as `file`. The page is rendered by
        LibreOffice's HTML import, which does not execute JavaScript and does not
        fetch referenced images or stylesheets - only what is inside the uploaded
        file is rendered. Same pipeline and 503 as the other Office tools.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The .html or .htm file to convert.
                pdfa:
                  type: string
                  enum: [off, 1b, 2b, 3b]
                  default: "off"
                  description: Plain PDF, or PDF/A-1b / -2b / -3b export.
      responses:
        "200":
          description: Converted PDF

  /pdf/compress:
    post:
      operationId: compressPdf
      tags: [pdf]
      summary: Shrink a PDF with Ghostscript's PDF presets
      description: Send the document as `file`. `quality` selects Ghostscript's
        own preset - extreme=`/screen` (72 dpi images), recommended=`/ebook`
        (150 dpi), high=`/printer` (300 dpi) - so text stays vector and pages
        keep their count. Two guarantees hold regardless of profile - the response
        is never larger than a plain re-serialisation (the 300 dpi preset inflates
        text-only documents,
        in which case the re-serialised bytes are returned instead), and the
        `X-PDF-Compression-Engine` response header names the engine that
        produced them (`ghostscript`, or `pdf-lib` when the host has no
        Ghostscript and only the re-serialisation path is available).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to compress.
                quality:
                  type: string
                  enum: [extreme, recommended, high]
                  default: recommended
                  description: Accepted, but not yet differentiated by the compressor.
      responses:
        "200":
          description: Compressed PDF

  /pdf/add-page-numbers:
    post:
      operationId: addPageNumbers
      tags: [pdf]
      summary: Stamp page numbers onto a PDF
      description: Send the document as `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to number.
                position:
                  type: string
                  enum: [bottom-center, bottom-right, bottom-left, top-center, top-right]
                  default: bottom-center
                startNumber:
                  type: integer
                  minimum: 1
                  maximum: 100000
                  default: 1
                format:
                  type: string
                  enum: ["1", "Page 1", "1/N"]
                  default: "1"
      responses:
        "200":
          description: Numbered PDF

  /pdf/duplicate-pages:
    post:
      operationId: duplicatePdfPages
      tags: [pdf]
      summary: Copy pages inside the same document
      description: Send the document as `file`. Copies go next to each original or at the end.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to copy pages within.
                pages:
                  type: string
                  description: Comma separated pages or ranges; empty means every page
                copies:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
                placement:
                  type: string
                  enum: [after, end]
                  default: after
      responses:
        "200":
          description: PDF containing the copied pages

  /pdf/repair:
    post:
      operationId: repairPdf
      tags: [pdf]
      summary: Rebuild a damaged PDF
      description: Send the document as `file`. No options - recovery is chosen from the file itself.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The damaged PDF.
      responses:
        "200":
          description: Repaired PDF. The `X-Repair-Recovered` header reports whether recovery was needed.

  /pdf/pdf-to-pdfa:
    post:
      operationId: pdfToPdfA
      tags: [pdf]
      summary: Convert a PDF to PDF/A for archiving
      description: Send the document as `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to convert.
                conformance:
                  type: string
                  enum: [1B, 2B, 2U, 3B, 3U]
                  default: 3B
      responses:
        "200":
          description: PDF/A document

  /pdf/extract-text:
    post:
      operationId: exportPdfText
      tags: [pdf]
      summary: Export the text layer as .txt or Markdown
      description: Send the document as `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to extract text from.
                format:
                  type: string
                  enum: [txt, md]
                  default: txt
                pages:
                  type: string
      responses:
        "200":
          description: Plain text or Markdown document

  /pdf/pdf-to-excel:
    post:
      operationId: pdfToExcel
      tags: [pdf]
      summary: Extract ruled tables as CSV spreadsheets
      description: Send the document as `file`. The table detector reads grids
        drawn with ruled lines; a layout of plain text columns without rules
        yields nothing and the route answers 422 rather than an empty file.
        One table downloads as `.csv`, several as a ZIP of per-table files.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF whose tables to extract.
                pages:
                  type: string
                  description: Comma separated page numbers and ranges. Empty means all pages.
                delimiter:
                  type: string
                  enum: [",", ";", "tab"]
                  default: ","
      responses:
        "200":
          description: A CSV file, or a ZIP of one CSV per table

  /pdf/pdf-form-inspect:
    post:
      operationId: inspectPdfForm
      tags: [pdf]
      summary: List a PDF's form fields
      description: Send the document as `file`. Answers the field inventory the
        filler UI builds its inputs from — names, kinds, current values and the
        choices dropdowns and radio groups offer. A PDF without form fields
        answers 422.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF whose fields to list.
      responses:
        "200":
          description: The field inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  fieldCount:
                    type: integer
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum: [text, checkbox, dropdown, optionlist, radio, signature, button]
                        value:
                          type: string
                        checked:
                          type: boolean
                        selected:
                          type: array
                          items:
                            type: string
                        options:
                          type: array
                          items:
                            type: string
                        maxLength:
                          type: integer
                        readOnly:
                          type: boolean
        "422":
          description: The PDF has no form fields

  /pdf/pdf-form-filler:
    post:
      operationId: fillPdfForm
      tags: [pdf]
      summary: Fill a PDF's form fields and optionally flatten
      description: Send the document as `file` plus `values`, a JSON object
        keyed by field name — strings fill text fields and select dropdown,
        option-list and radio options, booleans check and uncheck checkboxes.
        Unknown names, wrong-typed values and choices the field does not offer
        are refused with a message naming the fields the form does have. When
        `flatten` is true the values become page content and the fields
        disappear; otherwise the result stays an editable form.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [values]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF form to fill.
                values:
                  type: string
                  description: JSON object keyed by field name.
                flatten:
                  type: boolean
                  default: true
      responses:
        "200":
          description: The filled PDF
        "400":
          description: A value does not fit the field it names
        "422":
          description: The PDF has no fields, or values name fields it does not have

  /pdf/ocr:
    post:
      operationId: ocrPdf
      tags: [pdf]
      summary: OCR a scanned PDF into .txt, Markdown or a searchable PDF
      description: Send the document as `file`. Pages are rendered and recognised with tesseract.js.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The scanned PDF.
                language:
                  type: string
                  enum: [eng, spa, fra, deu, ita, por, nld, rus, pol, tur, ara, hin, heb, chi_sim, chi_tra, jpn, kor]
                  default: eng
                mode:
                  type: string
                  enum: [text, searchable-pdf]
                  default: text
                format:
                  type: string
                  enum: [txt, md]
                  default: txt
                pages:
                  type: string
      responses:
        "200":
          description: Recognised text (.txt/.md) or a searchable PDF

  /pdf/translate-pdf:
    post:
      operationId: translatePdf
      tags: [pdf]
      summary: Translate a document's text with an AI model
      description: Send the document as `file`. The text layer is extracted page
        by page and each page is sent to the model with a strict JSON contract;
        the answer is JSON the UI renders and offers as a Markdown download.
        Layout is not rebuilt — this is the translated text, not a translated
        PDF. At most 50 text pages per request. Needs an `OPENAI_API_KEY`; when
        the key is absent the route answers 503.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to translate.
                targetLanguage:
                  type: string
                  enum: [english, spanish, french, german, italian, portuguese, dutch, polish,
                    turkish, russian, arabic, hebrew, hindi, chinese (simplified),
                    chinese (traditional), japanese, korean]
                  default: english
      responses:
        "200":
          description: Page-by-page translation
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        num:
                          type: integer
                        text:
                          type: string
                  targetLanguage:
                    type: string
                  failedPages:
                    type: integer
                  pageCount:
                    type: integer
                  markdown:
                    type: string
        "422":
          description: No extractable text layer, or the document exceeds 50 text pages
        "503":
          description: OPENAI_API_KEY is not configured

  /pdf/ai-summarize:
    post:
      operationId: summarizePdf
      tags: [pdf]
      summary: Summarise a document with an AI model
      description: Send the document as `file`. The only AI endpoint that needs
        an `OPENAI_API_KEY`; when the key is absent the API still starts and
        this route answers 503. Returns JSON rather than a file. The text layer
        is truncated to roughly 12000 characters before being sent to the model.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to summarise.
      responses:
        "200":
          description: Summary, key points, word count and page count
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                  keyPoints:
                    type: array
                    items:
                      type: string
                  wordCount:
                    type: integer
                  pageCount:
                    type: integer
        "422":
          description: The PDF has no extractable text layer
        "503":
          description: OPENAI_API_KEY is not configured

  /pdf/chat-with-document:
    post:
      operationId: chatWithDocument
      tags: [pdf]
      summary: Ask one question about a document, answered from its contents
      description: Send the document as `file` plus a `question`. The text layer
        is extracted and sent to the model with the question under a strict
        contract — answer only from the document, and say plainly when it does
        not contain the answer. No chunking and no vector store: the whole text
        layer (to roughly 60000 characters) rides in one prompt, so this suits
        documents of tens of pages rather than thousands. Needs an
        `OPENAI_API_KEY`; when the key is absent the route answers 503.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [question]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to ask about.
                question:
                  type: string
                  maxLength: 2000
                  description: The question to answer.
      responses:
        "200":
          description: The grounded answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: string
                  answer:
                    type: string
                  pageCount:
                    type: integer
                  markdown:
                    type: string
        "422":
          description: No extractable text layer, or the model returned nothing usable
        "503":
          description: OPENAI_API_KEY is not configured

  /pdf/redact:
    post:
      operationId: redactPdf
      tags: [pdf]
      summary: Permanently remove sensitive text from a document
      description: Send the document as `file` plus a `terms` JSON array of
        literal search strings. Every hit is removed from the file — the text
        objects are deleted and a black box drawn in their place, not a
        rectangle painted over live text. Matching is literal, case-insensitive
        and non-overlapping (a hit inside text already redacted by an earlier
        term on the same page is not counted again); a wrong term removes
        nothing and a run that removes nothing is refused. Returns the
        redacted PDF.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [terms]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to redact.
                terms:
                  type: string
                  description: JSON array of literal terms to remove, e.g.
                    `["42-1337-ALPHA", "grace@example.com"]`.
      responses:
        "200":
          description: The redacted PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: The terms payload is missing or empty
        "422":
          description: None of the terms were found in the document

  /pdf/sign:
    post:
      operationId: signPdf
      tags: [pdf]
      summary: Cryptographically sign a document with a P12 certificate
      description: |
        Send the document as `file` and either an uploaded certificate part
        `p12` with its `passphrase`, or just a `passphrase` — a self-signed
        certificate is then generated for this run. The signature is a real
        PKCS#7 detached signature (Adobe.PPKLite / adbe.pkcs7.detached) whose
        ByteRange covers the whole file, with a visible stamp drawn on page 1
        (signer name and time). No timestamp authority is contacted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [passphrase]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to sign.
                p12:
                  type: string
                  format: binary
                  description: Optional PKCS#12 certificate (.p12/.pfx).
                passphrase:
                  type: string
                  description: The certificate's passphrase; also protects the generated self-signed key.
                signerName:
                  type: string
                  description: Name drawn on the visible stamp (and used for the generated certificate).
      responses:
        "200":
          description: The signed PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Missing passphrase
        "422":
          description: The certificate could not be opened with that passphrase

  /pdf/pdf-to-word:
    post:
      operationId: pdfToWord
      tags: [pdf]
      summary: Rebuild a PDF's text as an editable Word document
      description: |
        Send the document as `file`. The text layer is extracted page by page
        and rebuilt as a DOCX — each page becomes a heading plus its
        paragraphs. This is a text rebuild, honestly: layout, columns, fonts,
        images and tables do not carry over. A scanned document without a
        text layer is refused (run OCR first).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to convert.
      responses:
        "200":
          description: The DOCX document
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "422":
          description: No extractable text layer

  /pdf/pdf-to-powerpoint:
    post:
      operationId: pdfToPowerpoint
      tags: [pdf]
      summary: Turn a PDF's pages into an editable slide deck
      description: |
        Send the document as `file`. Each page becomes one slide carrying that
        page's extracted text — a real editable deck, not a picture deck.
        Text only: images, backgrounds and layout do not carry over, and a
        text-free page becomes a slide noting that, so page count is always
        preserved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to convert.
      responses:
        "200":
          description: The PPTX deck
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        "422":
          description: The PDF has no pages

  /pdf/edit:
    post:
      operationId: editPdfContent
      tags: [pdf]
      summary: Place text, rectangles and an image on top of a PDF
      description: |
        Send the document as `file` plus an `ops` JSON array of overlay
        operations. This is composition on top of the page — the card's exact
        promise — not a rewrite of existing text, which no PDF library can
        reflow. One optional `image` part (JPG/PNG) backs every image op.
        Coordinates are PDF points with the origin at the page's bottom-left.
        Op shapes: `{"type":"text","page":1,"x":72,"y":700,"text":"hi",
        "size":14,"color":"#111111"}`, `{"type":"rect","page":1,"x":72,
        "y":600,"w":200,"h":80,"color":"#FFD24D","opacity":0.5}` and
        `{"type":"image","page":1,"x":72,"y":450,"w":160}` (height follows
        the image's aspect ratio; default width is a quarter of the page).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ops]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to edit.
                ops:
                  type: string
                  description: JSON array of overlay operations (text, rect, image).
                image:
                  type: string
                  format: binary
                  description: Optional JPG/PNG used by image ops.
      responses:
        "200":
          description: The edited PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Malformed ops, an out-of-range page, or an image op without the image part

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ToolCategory:
      type: string
      description: |
        Landing-page display category. Order is significant and mirrors the
        reference design: organize, convert-to, convert-from, edit, security, ai.
      enum:
        - organize
        - convert-to
        - convert-from
        - edit
        - security
        - ai

    ToolAccent:
      type: string
      description: |
        Named colour token for the tool icon tile. Resolves to a theme token in
        the web app (`primary` -> bg-primary/10 text-primary, `ai` ->
        bg-secondary-container/20 text-secondary-hover). Never a raw hex.
      enum:
        - primary
        - secondary
        - tertiary
        - ai

    ToolWorkspace:
      type: string
      description: Which of the two approved workspace templates the tool uses.
      enum:
        - stepper
        - page-picker

    ToolWireStatus:
      type: string
      description: |
        Whether the tool has a live backend route. `pending` tools must render a
        disabled Process button plus a visible badge.
      enum:
        - implemented
        - partial
        - pending

    Tool:
      type: object
      required:
        [id, name, description, category, accent, icon, workspace, status,
         inputLabel, outputLabel]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        keywords:
          type: array
          description: Search synonyms, matching the reference's data-keywords
          items:
            type: string
        popular:
          type: boolean
          description: Shows the "Popular" ribbon on the landing card
        category:
          $ref: "#/components/schemas/ToolCategory"
        accent:
          $ref: "#/components/schemas/ToolAccent"
        icon:
          type: string
          description: lucide-react export name, used identically on card and workspace header
        workspace:
          $ref: "#/components/schemas/ToolWorkspace"
        status:
          $ref: "#/components/schemas/ToolWireStatus"
        route:
          type: ["string", "null"]
          description: Live backend route path, or null when backend-pending
        inputLabel:
          type: string
        outputLabel:
          type: string
        acceptMultiple:
          type: boolean
        capture:
          type: string
          enum: [environment, user]
          description: Facing mode for the upload input, so a capture tool can open the
            camera instead of the gallery. Omitted by tools that just read files.
        accept:
          type: array
          description: Accepted mime types and extensions for the file picker
          items:
            type: string

    PdfPageInfo:
      type: object
      required: [pageCount, pages, thumbnailsIncluded, thumbnailWidth]
      properties:
        pageCount:
          type: number
        thumbnailsIncluded:
          type: boolean
          description: True when every page carries a preview image
        thumbnailWidth:
          type: number
        pages:
          type: array
          items:
            type: object
            required: [number, width, height, rotation]
            properties:
              number:
                type: number
              width:
                type: number
              height:
                type: number
              rotation:
                type: number
              thumbnail:
                type: string
                description: PNG data URL preview of the page, when previews were requested

    Stats:
      type: object
      required: [totalJobs, jobsToday, filesProcessed, totalInputSizeMb, totalOutputSizeMb]
      properties:
        totalJobs:
          type: number
        jobsToday:
          type: number
        filesProcessed:
          type: number
        totalInputSizeMb:
          type: number
        totalOutputSizeMb:
          type: number
        popularTool:
          type: ["string", "null"]

    Job:
      type: object
      required: [id, tool, originalFilename, inputSizeBytes, status, createdAt]
      properties:
        id:
          type: number
        tool:
          type: string
        originalFilename:
          type: string
        inputSizeBytes:
          type: number
        outputSizeBytes:
          type: ["number", "null"]
        status:
          type: string
        createdAt:
          type: string

    JobInput:
      type: object
      required: [tool, originalFilename, inputSizeBytes, status]
      properties:
        tool:
          type: string
        originalFilename:
          type: string
        inputSizeBytes:
          type: number
        outputSizeBytes:
          type: ["number", "null"]
        status:
          type: string
